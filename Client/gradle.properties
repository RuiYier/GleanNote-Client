# 本机开发环境基线，依据 docs/ENVIRONMENT.md 第 2、7 章。
# 系统 JAVA_HOME 指向不存在的 jdk-25.0.2，此行用于覆盖，删除后构建即失败。
org.gradle.java.home=D:/DevelopmentTools/Java

# 多模块 + Kotlin + Compose 编译，参考工程 -Xmx1536m 偏小。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# GleanNote 全量使用 AndroidX（Compose / Room / WorkManager / Navigation）。
# 参考工程为纯 XML 项目，此处必须与其 android.useAndroidX=false 相反。
android.useAndroidX=true
android.nonTransitiveRClass=true

# SDK 位于非默认盘符，允许路径检查通过。
android.overridePathCheck=true

kotlin.code.style=official
