/*
 * GleanNote app 模块构建配置。
 * 版本依据：本机仅安装 SDK Platform 34 / Build Tools 34.0.0，故 compileSdk、targetSdk 固定 34。
 * minSdk 26 来自 CLIENT-ARCHITECTURE.md 4.3；Kotlin 1.9.24 与 Compose Compiler 1.5.14 严格配对。
 * 依赖清单见 docs/ENVIRONMENT.md 第 6 章；实现上采用单 Gradle 模块 + 包分层，
 * 对应主文档 3.3 的 core/feature 划分，避免多模块首次构建的额外解析开销。
 */
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.example.gleannote'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.gleannote'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        /* 默认指向已部署的公网服务端；联调时可临时用 -PGN_BASE_URL 覆盖为局域网地址。 */
        buildConfigField 'String', 'BASE_URL', "\"${project.findProperty('GN_BASE_URL') ?: 'http://20.214.153.6:8080/v1'}\""
        buildConfigField 'String', 'CLIENT_VERSION', '"0.1.0"'

    }

    buildTypes {
        debug {
            /* debug 允许明文流量到 LAN 服务端（Manifest 的 usesCleartextTraffic），仅联调用。 */
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'String', 'BASE_URL', '"http://20.214.153.6:8080/v1"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }

    packaging {
        resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' }
    }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.2'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'io.coil-kt:coil-compose:2.6.0'
    implementation 'androidx.camera:camera-camera2:1.3.3'
    implementation 'androidx.camera:camera-lifecycle:1.3.3'
    implementation 'androidx.camera:camera-view:1.3.3'
    implementation 'org.commonmark:commonmark:0.22.0'
    /* GFM 表格扩展：识别 | 分隔的表格并保留列对齐方式 */
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.22.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'androidx.room:room-testing:2.6.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.06.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
