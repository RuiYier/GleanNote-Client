<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440">
<defs>
  <rect id="lg-a" width="28" height="14" fill="#EEF0F3" stroke="#1F2328" stroke-width="1"/>
  <rect id="lg-b" width="28" height="14" fill="#F7F8FA" stroke="#1F2328" stroke-width="1"/>
  <rect id="lg-c" width="28" height="14" fill="#FFFFFF" stroke="#1F2328" stroke-width="1"/>
</defs>
<rect x="0" y="0" width="680" height="440" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="20" y="30" fill="#1F2328" font-size="16" text-anchor="start">转换任务状态机</text>
<text x="20" y="50" fill="#1F2328" font-size="11" text-anchor="start">QUEUED → RUNNING → SUCCEEDED / FAILED / CANCELED　含 JobPhase 阶段文案</text>
<line x1="20" y1="60" x2="660" y2="60" stroke="#1F2328" stroke-width="1"/>
<rect x="30" y="95" width="130" height="44" fill="#F7F8FA" stroke="#1F2328" stroke-width="1.2"/>
<text x="95.0" y="113" fill="#1F2328" font-size="11" text-anchor="middle">排队中</text>
<text x="95.0" y="128" fill="#1F2328" font-size="10" text-anchor="middle">QUEUED</text>
<rect x="215" y="95" width="130" height="44" fill="#F7F8FA" stroke="#1F2328" stroke-width="1.2"/>
<text x="280.0" y="113" fill="#1F2328" font-size="11" text-anchor="middle">处理中</text>
<text x="280.0" y="128" fill="#1F2328" font-size="10" text-anchor="middle">RUNNING</text>
<rect x="410" y="95" width="130" height="44" fill="#F7F8FA" stroke="#1F2328" stroke-width="1.2"/>
<text x="475.0" y="113" fill="#1F2328" font-size="11" text-anchor="middle">成功</text>
<text x="475.0" y="128" fill="#1F2328" font-size="10" text-anchor="middle">SUCCEEDED</text>
<rect x="565" y="95" width="100" height="44" fill="#F7F8FA" stroke="#1F2328" stroke-width="1.2"/>
<text x="615.0" y="121.0" fill="#1F2328" font-size="11" text-anchor="middle">校对编辑</text>
<rect x="215" y="205" width="130" height="44" fill="#F7F8FA" stroke="#1F2328" stroke-width="1.2"/>
<text x="280.0" y="223" fill="#1F2328" font-size="11" text-anchor="middle">失败</text>
<text x="280.0" y="238" fill="#1F2328" font-size="10" text-anchor="middle">FAILED</text>
<rect x="410" y="205" width="130" height="44" fill="#F7F8FA" stroke="#1F2328" stroke-width="1.2"/>
<text x="475.0" y="223" fill="#1F2328" font-size="11" text-anchor="middle">已取消</text>
<text x="475.0" y="238" fill="#1F2328" font-size="10" text-anchor="middle">CANCELED</text>
<line x1="160" y1="117" x2="213" y2="117" stroke="#1F2328" stroke-width="1"/>
<polyline points="206,113 213,117 206,121" fill="none" stroke="#1F2328" stroke-width="1"/>
<text x="163" y="109" fill="#1F2328" font-size="10" text-anchor="start">开始处理</text>
<line x1="345" y1="117" x2="408" y2="117" stroke="#1F2328" stroke-width="1"/>
<polyline points="401,113 408,117 401,121" fill="none" stroke="#1F2328" stroke-width="1"/>
<text x="348" y="109" fill="#1F2328" font-size="10" text-anchor="start">完成</text>
<line x1="540" y1="117" x2="563" y2="117" stroke="#1F2328" stroke-width="1"/>
<polyline points="557,113 563,117 557,121" fill="none" stroke="#1F2328" stroke-width="1"/>
<polyline points="280,139 280,203" fill="none" stroke="#1F2328" stroke-width="1"/>
<polyline points="276,196 280,203 283,196" fill="none" stroke="#1F2328" stroke-width="1"/>
<text x="286" y="175" fill="#1F2328" font-size="10" text-anchor="start">异常 / 超时</text>
<polyline points="345,139 380,139 380,227 408,227" fill="none" stroke="#1F2328" stroke-width="1"/>
<polyline points="401,230 408,227 401,223" fill="none" stroke="#1F2328" stroke-width="1"/>
<text x="352" y="160" fill="#1F2328" font-size="10" text-anchor="start">用户取消</text>
<polyline points="280,249 280,292 95,292 95,141" fill="none" stroke="#1F2328" stroke-width="1"/>
<polyline points="98,148 95,141 91,148" fill="none" stroke="#1F2328" stroke-width="1"/>
<text x="150" y="287" fill="#1F2328" font-size="10" text-anchor="start">重试发起新任务 → 回到排队中</text>
<polyline points="475,249 475,310 115,310 115,141" fill="none" stroke="#1F2328" stroke-width="1"/>
<polyline points="118,148 115,141 111,148" fill="none" stroke="#1F2328" stroke-width="1"/>
<text x="150" y="305" fill="#1F2328" font-size="10" text-anchor="start">重新转换 → 回到排队中</text>
<line x1="20" y1="330" x2="660" y2="330" stroke="#1F2328" stroke-width="1"/>
<text x="20" y="348" fill="#1F2328" font-size="11" text-anchor="start">JobPhase 阶段文案（PRD FR-05、API §3.2）</text>
<text x="30" y="368" fill="#1F2328" font-size="10" text-anchor="start">QUEUED 排队中</text>
<text x="360" y="368" fill="#1F2328" font-size="10" text-anchor="start">RECOGNIZING 正在识别第 N/M 页</text>
<text x="30" y="388" fill="#1F2328" font-size="10" text-anchor="start">GENERATING 正在生成 Markdown</text>
<text x="360" y="388" fill="#1F2328" font-size="10" text-anchor="start">COMPLETED 已完成</text>
<text x="20" y="410" fill="#1F2328" font-size="10" text-anchor="start">图例：矩形 = 状态节点　折线箭头 = 状态迁移　文字 = 触发条件 / 阶段文案</text>
<text x="20" y="426" fill="#1F2328" font-size="10" text-anchor="start">排队中与处理中均可取消；失败与已取消保留草稿与页面图片，可原地重试；终态后拉取笔记详情</text>
</svg>
