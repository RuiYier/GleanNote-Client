<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400">
<defs>
  <rect id="lg-a" width="28" height="14" fill="#EEF0F3" stroke="#1F2328" stroke-width="1"/>
  <rect id="lg-b" width="28" height="14" fill="#F7F8FA" stroke="#1F2328" stroke-width="1"/>
  <rect id="lg-c" width="28" height="14" fill="#FFFFFF" stroke="#1F2328" stroke-width="1"/>
</defs>
<rect x="0" y="0" width="680" height="400" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="20" y="30" fill="#1F2328" font-size="16" text-anchor="start">同步状态机</text>
<text x="20" y="50" fill="#1F2328" font-size="11" text-anchor="start">在线 / 离线 / 同步中 / 同步失败 / 游标过期全量重初始化（PRD FR-10、A §2.8 / §6.7）</text>
<line x1="20" y1="60" x2="660" y2="60" stroke="#1F2328" stroke-width="1"/>
<rect x="30" y="100" width="130" height="44" fill="#F7F8FA" stroke="#1F2328" stroke-width="1.2"/>
<text x="95.0" y="118" fill="#1F2328" font-size="11" text-anchor="middle">在线</text>
<text x="95.0" y="133" fill="#1F2328" font-size="10" text-anchor="middle">已同步</text>
<rect x="215" y="100" width="130" height="44" fill="#F7F8FA" stroke="#1F2328" stroke-width="1.2"/>
<text x="280.0" y="126.0" fill="#1F2328" font-size="11" text-anchor="middle">同步中</text>
<rect x="400" y="100" width="130" height="44" fill="#F7F8FA" stroke="#1F2328" stroke-width="1.2"/>
<text x="465.0" y="126.0" fill="#1F2328" font-size="11" text-anchor="middle">同步失败</text>
<rect x="30" y="215" width="130" height="44" fill="#F7F8FA" stroke="#1F2328" stroke-width="1.2"/>
<text x="95.0" y="241.0" fill="#1F2328" font-size="11" text-anchor="middle">离线</text>
<rect x="215" y="215" width="190" height="44" fill="#F7F8FA" stroke="#1F2328" stroke-width="1.2"/>
<text x="310.0" y="233" fill="#1F2328" font-size="11" text-anchor="middle">全量重初始化</text>
<text x="310.0" y="248" fill="#1F2328" font-size="10" text-anchor="middle">游标过期</text>
<line x1="160" y1="122" x2="213" y2="122" stroke="#1F2328" stroke-width="1"/>
<polyline points="206,118 213,122 206,126" fill="none" stroke="#1F2328" stroke-width="1"/>
<text x="163" y="114" fill="#1F2328" font-size="10" text-anchor="start">触发同步</text>
<line x1="345" y1="122" x2="398" y2="122" stroke="#1F2328" stroke-width="1"/>
<polyline points="391,118 398,122 391,126" fill="none" stroke="#1F2328" stroke-width="1"/>
<text x="348" y="114" fill="#1F2328" font-size="10" text-anchor="start">失败</text>
<polyline points="280,100 280,80 95,80 95,98" fill="none" stroke="#1F2328" stroke-width="1"/>
<polyline points="91,91 95,98 98,91" fill="none" stroke="#1F2328" stroke-width="1"/>
<text x="150" y="75" fill="#1F2328" font-size="10" text-anchor="start">同步完成</text>
<polyline points="465,144 465,170 280,170 280,146" fill="none" stroke="#1F2328" stroke-width="1"/>
<polyline points="283,153 280,146 276,153" fill="none" stroke="#1F2328" stroke-width="1"/>
<text x="300" y="165" fill="#1F2328" font-size="10" text-anchor="start">重试</text>
<polyline points="95,144 95,213" fill="none" stroke="#1F2328" stroke-width="1"/>
<polyline points="91,206 95,213 98,206" fill="none" stroke="#1F2328" stroke-width="1"/>
<text x="100" y="185" fill="#1F2328" font-size="10" text-anchor="start">断网</text>
<polyline points="160,237 190,237 190,122 213,122" fill="none" stroke="#1F2328" stroke-width="1"/>
<polyline points="206,125 213,122 206,118" fill="none" stroke="#1F2328" stroke-width="1"/>
<text x="165" y="255" fill="#1F2328" font-size="10" text-anchor="start">网络恢复</text>
<polyline points="280,144 280,213" fill="none" stroke="#1F2328" stroke-width="1"/>
<polyline points="276,206 280,213 283,206" fill="none" stroke="#1F2328" stroke-width="1"/>
<text x="286" y="185" fill="#1F2328" font-size="10" text-anchor="start">410 游标过期</text>
<polyline points="405,237 430,237 430,190 310,190 310,146" fill="none" stroke="#1F2328" stroke-width="1"/>
<polyline points="313,153 310,146 306,153" fill="none" stroke="#1F2328" stroke-width="1"/>
<text x="320" y="205" fill="#1F2328" font-size="10" text-anchor="start">全量重初始化后继续同步</text>
<line x1="20" y1="300" x2="660" y2="300" stroke="#1F2328" stroke-width="1"/>
<text x="20" y="320" fill="#1F2328" font-size="10" text-anchor="start">图例：矩形 = 同步状态　折线箭头 = 状态迁移　文字 = 触发条件</text>
<text x="20" y="340" fill="#1F2328" font-size="10" text-anchor="start">触发时机：登录成功、回前台、网络恢复、笔记保存、下拉刷新、手动同步；失败不阻塞本地编辑</text>
<text x="20" y="360" fill="#1F2328" font-size="10" text-anchor="start">离线变更进入待同步队列；410 SYNC_CURSOR_EXPIRED 清空游标并全量重新初始化</text>
<text x="20" y="382" fill="#1F2328" font-size="10" text-anchor="start">浅色背景 / 深色文字 · 状态机示意，不含像素尺寸</text>
</svg>
