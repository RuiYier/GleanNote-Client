<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380">
<defs>
  <rect id="lg-a" width="28" height="14" fill="#EEF0F3" stroke="#1F2328" stroke-width="1"/>
  <rect id="lg-b" width="28" height="14" fill="#F7F8FA" stroke="#1F2328" stroke-width="1"/>
  <rect id="lg-c" width="28" height="14" fill="#FFFFFF" stroke="#1F2328" stroke-width="1"/>
</defs>
<rect x="0" y="0" width="680" height="380" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="20" y="30" fill="#1F2328" font-size="16" text-anchor="start">保存状态机</text>
<text x="20" y="50" fill="#1F2328" font-size="11" text-anchor="start">已保存 / 保存中 / 未保存 / 待同步（顶部保存状态指示，PRD FR-06 / FR-10）</text>
<line x1="20" y1="60" x2="660" y2="60" stroke="#1F2328" stroke-width="1"/>
<rect x="250" y="70" width="160" height="34" fill="#F7F8FA" stroke="#1F2328" stroke-width="1.2"/>
<text x="330.0" y="91.0" fill="#1F2328" font-size="11" text-anchor="middle">编辑输入</text>
<rect x="30" y="150" width="130" height="46" fill="#F7F8FA" stroke="#1F2328" stroke-width="1.2"/>
<text x="95.0" y="177.0" fill="#1F2328" font-size="11" text-anchor="middle">已保存</text>
<rect x="205" y="150" width="130" height="46" fill="#F7F8FA" stroke="#1F2328" stroke-width="1.2"/>
<text x="270.0" y="177.0" fill="#1F2328" font-size="11" text-anchor="middle">保存中</text>
<rect x="380" y="150" width="130" height="46" fill="#F7F8FA" stroke="#1F2328" stroke-width="1.2"/>
<text x="445.0" y="177.0" fill="#1F2328" font-size="11" text-anchor="middle">未保存</text>
<rect x="555" y="150" width="110" height="46" fill="#F7F8FA" stroke="#1F2328" stroke-width="1.2"/>
<text x="610.0" y="177.0" fill="#1F2328" font-size="11" text-anchor="middle">待同步</text>
<polyline points="330,104 330,148" fill="none" stroke="#1F2328" stroke-width="1"/>
<polyline points="326,141 330,148 333,141" fill="none" stroke="#1F2328" stroke-width="1"/>
<text x="336" y="130" fill="#1F2328" font-size="10" text-anchor="start">停止输入 2 秒 / 手动保存</text>
<line x1="203" y1="173" x2="162" y2="173" stroke="#1F2328" stroke-width="1"/>
<polyline points="169,169 162,173 169,177" fill="none" stroke="#1F2328" stroke-width="1"/>
<text x="165" y="165" fill="#1F2328" font-size="10" text-anchor="start">保存成功</text>
<line x1="337" y1="173" x2="378" y2="173" stroke="#1F2328" stroke-width="1"/>
<polyline points="372,169 378,173 372,177" fill="none" stroke="#1F2328" stroke-width="1"/>
<text x="339" y="165" fill="#1F2328" font-size="10" text-anchor="start">保存失败</text>
<polyline points="445,196 445,230 270,230 270,198" fill="none" stroke="#1F2328" stroke-width="1"/>
<polyline points="273,205 270,198 266,205" fill="none" stroke="#1F2328" stroke-width="1"/>
<text x="280" y="225" fill="#1F2328" font-size="10" text-anchor="start">重试</text>
<polyline points="250,196 250,252 590,252 590,198" fill="none" stroke="#1F2328" stroke-width="1"/>
<polyline points="593,205 590,198 586,205" fill="none" stroke="#1F2328" stroke-width="1"/>
<text x="300" y="247" fill="#1F2328" font-size="10" text-anchor="start">离线本地保存成功 → 待同步</text>
<polyline points="630,196 630,278 110,278 110,198" fill="none" stroke="#1F2328" stroke-width="1"/>
<polyline points="113,205 110,198 106,205" fill="none" stroke="#1F2328" stroke-width="1"/>
<text x="300" y="273" fill="#1F2328" font-size="10" text-anchor="start">联网后自动同步 → 已保存</text>
<line x1="20" y1="300" x2="660" y2="300" stroke="#1F2328" stroke-width="1"/>
<text x="20" y="320" fill="#1F2328" font-size="10" text-anchor="start">图例：矩形 = 保存状态　折线箭头 = 状态迁移　文字 = 触发条件</text>
<text x="20" y="340" fill="#1F2328" font-size="10" text-anchor="start">自动保存失败显示「未保存」并提供重试；离线本地保存成功后标识「待同步」，联网后自动同步</text>
<text x="20" y="360" fill="#1F2328" font-size="10" text-anchor="start">浅色背景 / 深色文字 · 状态机示意，不含像素尺寸</text>
</svg>
